# CI

# PUSH, MERGE, Pull Request

# CD

name: Zelda Sample Backend Service Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

# 이미지의 Tag를 동적으로 생성할 수 있어야 합니다.
jobs:

  tagging:
    name: 태깅 및 릴리즈 1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: versioning and tagging
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: releasing
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_version }}
          name: ${{ steps.tag_version.outputs.new_version }}
          body: ${{ steps.tag_version.outputs.changelog }}

